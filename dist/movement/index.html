<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hillbilly Hoedown Movement Lab</title>
<link rel="stylesheet" href="../test-screen.css">
<style>*{box-sizing:border-box}body{margin:0;background:#253429;color:#fff0cf;font:16px system-ui}main{max-width:750px;margin:auto;padding:12px}h1{font:700 30px Georgia;margin:8px 0;color:#ffd987}canvas{width:100%;height:40dvh;min-height:230px;max-height:480px;display:block;border-radius:12px;background:#8d9f76}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px}button,select{font:inherit;border:0;background:#f2d399;color:#30251b;padding:8px;min-height:44px;border-radius:8px}button[aria-pressed=true]{background:#8cd4bf}button:disabled{opacity:.5}#stick{position:relative;flex:none;width:100px;height:100px;border-radius:50%;border:2px solid #e8c98d;background:#405747;touch-action:none;user-select:none}#stick span{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:#f2d399;transform:translate(-50%,-50%) translate(var(--x,0px),var(--y,0px));pointer-events:none}[hidden]{display:none!important}p{margin:8px 0}a{color:#ffd987}details{margin-top:10px}.sliders{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sliders label{display:grid}</style>
<main class="test-shell"><a class="test-hide" href="../">Hillbilly Hoedown</a><h1 class="test-hide" id="title">Movement Lab</h1>
<div class="test-top"><div class="test-full-toolbar"><button type="button" class="test-full-enter">Full screen</button><button type="button" class="test-full-exit" aria-label="Exit full screen">×</button></div><div class="hud"><p id="status" role="status">Loading yard…</p></div></div><div class="test-view test-viewport"><canvas id="view" aria-label="3D farm and fairground walkthrough"></canvas></div><div class="test-side"><div class="row"><label>Map <select id="map"><option value="walk">Farm &amp; Fairground walkthrough</option><option value="yard">Coop raid yard</option><option value="pen">Greased Pig arena</option><option value="lane">Paper Route lane</option><option value="chase">Rabbit Hunt paddock</option><option value="pond">Redneck Fishing pond</option><option value="derby">Demolition Derby ring</option><option value="ferry">Watermelon Ferry channel</option><option value="slalom">Shopping Cart Slalom hill</option><option value="bog">Mud Bog tow course</option><option value="feed">Feed Store loading yard</option><option value="tower">Water Tower Dash climb</option><option value="sheep">Sheep Herdin’ pasture</option><option value="golf">Hillbilly Golf loop</option><option value="junk">Junkyard Jamboree workshop</option><option value="midway">County Fair midway</option><option value="teams">Four-Team Matchup Plaza</option><option value="tug">Tug of War twin lanes</option><option value="pie">Pie Cookin’ courtyard</option></select></label><label>Character <select id="kind"><option value="fox">Fox</option><option value="farmer" selected>Male farmer</option><option value="farmer-copper">Female farmer</option><option value="rabbit">Rabbit</option></select></label><label>Camera <select id="camera"><option value="follow">Low follow</option><option value="boots" data-farmer>Farmer jeans and boots</option><option value="arms" data-farmer>Farmer arms and hands</option><option value="torso" data-farmer>Farmer overalls close-up</option><option value="portrait" data-farmer>Farmer close-up</option><option value="front" data-farmer>Farmer full body</option><option value="three-quarter" data-farmer>Farmer three-quarter close-up</option><option value="profile-close" data-farmer>Farmer profile close-up</option><option value="profile" data-farmer>Farmer side view</option><option value="rear" data-farmer>Farmer rear view</option><option value="top">Shared overhead</option></select></label></div>
<label><input type="checkbox" id="activity"> Show live activity</label>
<div id="walk-controls" class="row" hidden><button id="farm-entry">Farm entrance</button><button id="fair-entry">Fairground entrance</button><label>Stage directory <select id="stage-directory"><option value="">Choose a stage</option></select></label></div>
<div id="matchup" class="row" hidden aria-label="Mock matchups"><strong>Heat 1</strong> Teal vs. Red <strong>Heat 2</strong> Gold vs. Plum</div>

<p id="stage-play" hidden><a id="stage-link" href="../field-games/">Play this stage</a></p>
<div class="controls"><div id="stick" aria-label="Movement thumbstick"><span></span></div><div>
<div class="row"><button data-rate=".25">¼×</button><button data-rate=".5">½×</button><button data-rate="1" aria-pressed="true">1×</button></div>
<div class="row"><button id="wave" disabled>Wave</button><button id="pause">Pause</button><button id="step" disabled>Step</button><button id="reset">Reset</button></div>
</div></div>
<details><summary>Follow camera settings</summary><div class="sliders">
<label>Distance<input id="distance" type="range" min="1.4" max="4" step=".1" value="2.4"></label><label>Height<input id="height" type="range" min=".50" max="1.8" step=".05" value=".86"></label>
<label>Side offset<input id="offset" type="range" min="-1" max="1" step=".05" value=".55"></label><label>Follow delay<input id="delay" type="range" min="0" max=".45" step=".025" value=".125"></label>
</div></details><p>To step while paused, hold a direction and tap Step.</p></div></main><script type="module" src="../test-screen.js"></script>
<script type="module" src="main.js?idle=5"></script></html>
