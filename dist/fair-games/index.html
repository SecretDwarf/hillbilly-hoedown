<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hillbilly Hoedown · Fairground Games</title>
<link rel="stylesheet" href="../test-screen.css">
<style>*{box-sizing:border-box}body{margin:0;background:#26382e;color:#fff2d7;font:16px system-ui}main{max-width:700px;margin:auto;padding:12px}header{padding:12px 16px;border-radius:15px;background:linear-gradient(90deg,#30281ce8,#30281c55),url(../farm.png) center 45%/cover}a{color:#ffe4a7}h1{margin:7px 0 0;color:#ffda8e;font:bold clamp(26px,6vw,42px) Georgia}.row,.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}.hud{justify-content:space-between}.hud output{color:#ffda8e;font-weight:bold}button{font:700 16px system-ui;color:#30271e;background:#efcb85;border:0;border-radius:9px;min-height:46px;padding:9px 13px;touch-action:manipulation}button[aria-pressed=true],#action{background:#8ed0ba}#action{min-width:120px}button:disabled{opacity:.5}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#9ab078;touch-action:none}p{margin:10px 0}[hidden]{display:none!important}</style>
<main class="test-shell"><header class="test-hide"><a href="../arcade/">Minigame Tests</a><h1>Fairground Games</h1></header>
<nav class="test-hide row" aria-label="Choose a game"><button id="tug" aria-pressed="true">Tug of War</button><button id="pie" aria-pressed="false">Pie Cookin’</button></nav>
<div class="test-top"><div class="test-full-toolbar"><button type="button" class="test-full-enter">Full screen</button><button type="button" class="test-full-exit" aria-label="Exit full screen">×</button></div><div class="test-readout"><div class="hud"><span id="status" role="status">Ready to pull</span><output id="score"></output></div>
</div></div><div class="test-view" style="--ratio:1.75"><canvas id="field" width="640" height="365" aria-label="Fairground game view"></canvas></div><div class="test-side">
<div class="row"><button id="start">Start match</button><button id="action" disabled>Pull</button><button id="tug-brace" disabled>Brace</button>
<div id="ingredients" hidden><button data-ingredient="0">Crust</button> <button data-ingredient="1">Filling</button> <button data-ingredient="2">Topping</button></div></div>
<p class="test-hide" id="instructions"></p><p class="test-hide">Keyboard: 4 pulls, and 2 braces. In Pie Cookin’, 1–3 add ingredients and the arrow keys aim.</p></div></main><script type="module" src="../test-screen.js"></script><script>if(location.hash==="#pie")location.replace("../field-games/#pie");</script><script type="module" src="game.js"></script></html>
