<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hillbilly Hoedown · Porch Band</title>
<style>*{box-sizing:border-box}body{margin:0;background:#26382e;color:#fff1d5;font:16px system-ui}main{width:min(100%,660px);margin:auto;padding:14px}header{border-radius:14px;padding:15px;background:linear-gradient(90deg,#29241fee,#29241f77),url(../farm.png) center 45%/cover}h1{font:bold 38px Georgia;color:#ffe19a;margin:8px 0 0}a{color:#ffe2a2}.hud{display:flex;justify-content:space-between;margin:12px 0;gap:10px}output{color:#ffe19a;font-weight:bold}.stage{height:205px;background:#493c2e;border:4px solid #be8057;border-radius:14px;position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr)}.lane{border-right:1px solid #87684e;color:#f9e7b7;text-align:center;padding-top:9px}.beatLine{position:absolute;bottom:28px;left:0;right:0;border-top:3px solid #ffcf77;pointer-events:none}.note{position:absolute;left:var(--lane);top:var(--top);width:34px;height:34px;transform:translateX(-50%);border-radius:50%;background:var(--ink);border:3px solid #fff0c2;display:grid;place-items:center;color:#28261b;font-weight:bold;pointer-events:none}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}button{font:700 16px system-ui;border:0;border-radius:9px;min-height:48px;padding:8px;background:#efcb84;color:#30261c;touch-action:manipulation}button[data-pad]{min-height:64px;background:var(--ink)}button[data-pad].ready{outline:4px solid #ffe491;outline-offset:2px}button:active{transform:translateY(2px)}button:disabled{opacity:.55}p{margin:10px 0}.pads{grid-template-columns:repeat(3,minmax(58px,86px));grid-template-rows:repeat(3,44px);justify-content:center}.pads button{min-height:44px;padding:3px;font-size:.83rem;border-radius:40px}.pads button:nth-child(1){grid-area:2/1}.pads button:nth-child(2){grid-area:1/2}.pads button:nth-child(3){grid-area:2/3}.pads button:nth-child(4){grid-area:3/2}
#screen-exit{display:none}body.full main{width:100%;max-width:none;height:100dvh;padding:max(7px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-rows:auto auto minmax(120px,1fr) auto auto}body.full .stage{height:auto;min-height:120px}body.full header,body.full p,body.full #full-screen{display:none}body.full #screen-exit{display:block;justify-self:end;grid-row:1;min-height:36px}body.full .hud{margin:3px 0}body.full .pads{margin:4px 0}@media(orientation:landscape){body.full main{grid-template-columns:1fr auto;grid-template-rows:auto auto minmax(120px,1fr) auto;gap:6px}body.full #screen-exit{grid-column:2}body.full .hud{grid-column:1/-1}body.full .pads{align-self:center}}
</style>
<main><header><a href="../arcade/">Minigame Tests</a><h1>Porch Band</h1></header>
<button id="screen-exit" aria-label="Exit full screen">×</button><div class="hud"><span id="status" role="status">Ready to play</span><output id="points">0 pts</output></div>
<div class="stage" id="stage" aria-label="Falling beat cues"><div class="lane">Washboard</div><div class="lane">Jug</div><div class="lane">Spoons</div><div class="lane">Stomp</div><div class="beatLine"></div><div id="notes" aria-hidden="true"></div></div>
<div class="pads"><button data-pad="0" style="--ink:#82cdb1">Washboard</button><button data-pad="1" style="--ink:#f4c573">Jug</button><button data-pad="2" style="--ink:#ec947c">Spoons</button><button data-pad="3" style="--ink:#bdafe9">Stomp</button></div>
<p>Tap the matching instrument when its cue reaches the gold line. You can also use 1–4.</p>
<button id="start">Start song</button> <button id="full-screen">Full screen</button></main>
<script type="module" src="game.js"></script></html>
